name: Securite (SAST, dependances, DAST)
on:
  push:
    branches: [main, preprod, staging, develop]
  pull_request:
    branches: [main, preprod, staging, develop]
  schedule:
    # Chaque lundi : nouvelles failles publiees depuis le dernier passage.
    - cron: "0 5 * * 1"
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Semgrep (OWASP Top 10, secrets)
        run: >
          semgrep scan --error --metrics=off
          --config p/default --config p/secrets --config p/owasp-top-ten
          --exclude target

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Image Docker a version figee plutot que l'action GitHub (tags de
      # l'action compromis en mars 2026).
      - name: Trivy (dependances Maven, secrets, Dockerfile)
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.67.2 fs
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed
          --skip-dirs target --exit-code 1 /src

  dast:
    # Scan actif OWASP ZAP de l'API reellement demarree (MySQL + backend),
    # a partir de sa description OpenAPI. Secrets jetables, propres au job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Demarrer MySQL et le backend
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_DATABASE=senyummies"
            echo "MYSQL_USER=senyummies"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: OWASP ZAP (scan API)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -v "$PWD/.zap/regles-api.tsv:/zap/wrk/regles.tsv:ro" \
            zaproxy/zap-stable:2.16.1 zap-api-scan.py \
            -t http://localhost:8080/api/v1/v3/api-docs -f openapi \
            -c regles.tsv -r rapport-zap.html -J rapport-zap.json
      - name: Rapport ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapport-zap
          path: zap/
      - name: Journaux du backend
        if: failure()
        run: docker compose logs backend | tail -200

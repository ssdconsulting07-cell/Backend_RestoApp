openapi: 3.0.3
info:
  title: SenYummies API
  description: >
    API commune du projet SenYummies, developpe pour le restaurant Chez Ketchup.
    Consommee par les deux frontends : App Client (public, commande invite) et
    SenYummies Manager (interne, authentifie par role). Ce contrat est la source
    de verite entre les 3 equipes : toute modification passe par une revue du
    lead Backend avant merge.
  version: "0.2.0"
servers:
  - url: http://localhost:8080/api/v1
    description: Environnement de developpement local
tags:
  - name: Authentification
  - name: Catalogue
  - name: Zones de livraison
  - name: Commandes
  - name: Paiements
security: []
paths:
  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion du staff SenYummies Manager
      description: Seul le back-office authentifie ses utilisateurs. L'App Client ne l'appelle jamais.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion reussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants incorrects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/first-login-password:
    post:
      tags: [Authentification]
      summary: Remplacer le mot de passe temporaire avant la premiere connexion
      description: Cette route publique n'emet un JWT qu'apres validation du mot de passe temporaire et enregistrement du nouveau mot de passe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstLoginPasswordRequest'
      responses:
        '200':
          description: Mot de passe remplace, session staff ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Nouveau mot de passe invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Identifiant ou mot de passe temporaire incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /staff-users:
    get:
      tags: [Authentification]
      summary: Lister les comptes du personnel (Gerant uniquement)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comptes staff sans donnees de mot de passe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffUser'
        '403':
          description: Role Gerant requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Authentification]
      summary: Creer un compte du personnel (Gerant uniquement)
      description: Genere un mot de passe temporaire retourne une seule fois. Le compte devra le remplacer avant d'acceder au Manager.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreateRequest'
      responses:
        '201':
          description: Compte cree avec identifiant et mot de passe temporaire a communiquer au staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
        '409':
          description: Identifiant deja utilise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /staff-users/{id}:
    patch:
      tags: [Authentification]
      summary: Modifier un compte du personnel (Gerant uniquement)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserUpdateRequest'
      responses:
        '200':
          description: Compte mis a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '403':
          description: Role Gerant requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Compte introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Authentification]
      summary: Desactiver un compte du personnel (Gerant uniquement)
      description: Desactivation reversible, sans suppression de l'historique. Le dernier Gerant actif et le compte courant ne peuvent pas etre desactives.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      responses:
        '204':
          description: Compte desactive
        '409':
          description: Le dernier Gerant actif ou le compte courant ne peut pas etre desactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /staff-users/{id}/permanent:
    delete:
      tags: [Authentification]
      summary: Supprimer definitivement un compte du personnel desactive (Gerant uniquement)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      responses:
        '204':
          description: Compte supprime
        '409':
          description: Le compte doit d'abord etre desactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /staff-users/{id}/temporary-password:
    post:
      tags: [Authentification]
      summary: Regenerer un mot de passe temporaire (Gerant uniquement)
      description: Invalide le mot de passe precedent et force son remplacement avant le prochain acces.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      responses:
        '200':
          description: Mot de passe temporaire retourne une seule fois
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
        '403':
          description: Role Gerant requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Compte introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /categories:
    get:
      tags: [Catalogue]
      summary: Categories du menu (publiees par le Gerant), visibles sans authentification
      description: >
        L'App Client n'affiche que les categories ACTIF. BROUILLON et ARCHIVE
        restent internes au back-office (Manager, espace Gerant).
      security: []
      parameters:
        - $ref: '#/components/parameters/FiltreStatutPublication'
      responses:
        '200':
          description: Liste des categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categorie'

  /produits:
    get:
      tags: [Catalogue]
      summary: Produits du menu, visibles sans authentification
      description: >
        Cote client : seuls les produits ACTIF d'une categorie ACTIF sont
        affiches ; disponibilite RUPTURE = affiche "Indisponible", non
        commandable. Les plats du jour et les accompagnements/condiments sont
        des ressources separees (fiches independantes du catalogue).
      security: []
      parameters:
        - $ref: '#/components/parameters/FiltreStatutPublication'
        - name: categorieId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Liste des produits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produit'

  /produits/{id}:
    get:
      tags: [Catalogue]
      summary: Detail d'un produit
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produit'
        '404':
          description: Produit introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /plats-du-jour:
    get:
      tags: [Catalogue]
      summary: Plats du jour (fiches independantes, rattachees a un jour de la semaine)
      description: >
        Plusieurs plats peuvent partager le meme jour. Cote client, seuls les
        plats ACTIF du jour courant sont commandables ; ceux des autres jours
        sont presentes comme programme de la semaine.
      security: []
      parameters:
        - $ref: '#/components/parameters/FiltreStatutPublication'
        - name: jour
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JourSemaine'
      responses:
        '200':
          description: Liste des plats du jour
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatDuJour'

  /accompagnements-condiments:
    get:
      tags: [Catalogue]
      summary: Accompagnements et condiments proposes a cote d'un produit
      description: >
        Meme regle a la caisse (Vendeur) et dans l'App Client : proposes sur
        les produits de la categorie Burgers, prix ajoute au prix du produit
        (0 = offert). Une ligne de commande porte au plus un accompagnement.
      security: []
      parameters:
        - $ref: '#/components/parameters/FiltreStatutPublication'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ACCOMPAGNEMENT, CONDIMENT]
      responses:
        '200':
          description: Liste des fiches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccompagnementCondiment'

  /annonces:
    get:
      tags: [Catalogue]
      summary: Annonces publiees par le Gerant (chaines de slides)
      description: >
        Les chaines ACTIF sont presentees successivement dans l'App Client
        (popup a l'arrivee), dans l'ordre de publication (publishedAt).
        Remplace l'ancienne ressource /nouveautes.
      security: []
      parameters:
        - $ref: '#/components/parameters/FiltreStatutPublication'
      responses:
        '200':
          description: Liste des chaines d'annonces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Annonce'

  /regions:
    get:
      tags: [Zones de livraison]
      summary: Regions du Senegal, activables par le Gerant pour la livraison
      security: []
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Liste des regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'

  /regions/{code}/secteurs:
    get:
      tags: [Zones de livraison]
      summary: Secteurs de livraison d'une region (arrondissements officiels ou zones ajoutees), avec leur prix
      description: Les secteurs masques par le Gerant (estMasque) ne sont pas proposes au client.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: DAKAR
      responses:
        '200':
          description: Liste des secteurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secteur'

  /commandes:
    post:
      tags: [Commandes]
      summary: Creation d'une commande (App Client invite, ou Vendeur au comptoir)
      description: >
        canal APP (App Client, sans compte) : paiement en ligne avant creation,
        statut initial PAYEE ; clientPrenom et clientTelephone requis ;
        adresseLivraison et secteurId requis si mode = LIVRAISON.
        canal COMPTOIR (Vendeur, authentifie) : mode RETRAIT.
        Le serveur fige nom et prixUnitaire de chaque ligne a la creation
        (snapshot) et recalcule sousTotal / fraisLivraison / total depuis le
        catalogue et le secteur : une valeur envoyee par le client qui ne
        correspond pas est refusee (400), jamais prise telle quelle.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandeCreation'
      responses:
        '201':
          description: Commande creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '400':
          description: Requete invalide (champ manquant, produit indisponible, prix ou total incoherent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Commandes]
      summary: Liste des commandes
      description: >
        Staff (bearerAuth) : files de travail Cuisine / Livreur / Vendeur,
        filtrables par statut et canal.
        Client invite (sans token) : clientTelephone obligatoire, ne renvoie
        que les commandes de ce numero (historique sans compte).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: clientTelephone
          in: query
          required: false
          description: Format international, ex. +221771234567
          schema:
            type: string
        - name: statut
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StatutCommande'
        - name: canal
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Canal'
      responses:
        '200':
          description: Liste des commandes (plus recentes d'abord)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commande'
        '400':
          description: Sans token, clientTelephone manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /commandes/{id}:
    get:
      tags: [Commandes]
      summary: Suivi d'une commande par son identifiant (client invite)
      security: []
      parameters:
        - $ref: '#/components/parameters/CommandeId'
      responses:
        '200':
          description: Etat de la commande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '404':
          description: Commande introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /commandes/{id}/statut:
    patch:
      tags: [Commandes]
      summary: Transition de statut par le staff
      description: |
        Transitions autorisees (le serveur les revalide, 403 sinon) - meme
        table que Manager_RestoApp src/auth/transitions.js :

        | De             | Vers           | Role(s)            | Mode      |
        |----------------|----------------|--------------------|-----------|
        | PAYEE          | EN_PREPARATION | CUISINE            | -         |
        | EN_PREPARATION | PRETE          | CUISINE            | -         |
        | PRETE          | EN_LIVRAISON   | CUISINE ou LIVREUR | LIVRAISON |
        | EN_LIVRAISON   | LIVREE         | LIVREUR            | LIVRAISON |
        | PRETE          | RETIREE        | VENDEUR            | RETRAIT   |
        | PAYEE          | ANNULEE        | CUISINE            | -         |

        La remise LIVREE se fait apres scan du QR presente par le client
        (contenu "SENYUMMIES-<id>").
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommandeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statut]
              properties:
                statut:
                  $ref: '#/components/schemas/StatutCommande'
      responses:
        '200':
          description: Commande mise a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '403':
          description: Role insuffisant ou transition interdite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /paiements/init:
    post:
      tags: [Paiements]
      summary: Initialisation du paiement d'une commande
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandeId]
              properties:
                commandeId:
                  type: string
      responses:
        '200':
          description: Reference et lien de paiement a suivre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaiementInit'

  /paiements/webhook:
    post:
      tags: [Paiements]
      summary: Callback du prestataire de paiement (PayDunya ou API directe, selon choix du PDG)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Format specifique au prestataire retenu (a preciser avec le PDG)
      responses:
        '200':
          description: Callback pris en compte

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FiltreStatutPublication:
      name: statut
      in: query
      required: false
      description: Filtre sur le statut editorial (l App Client demande ACTIF)
      schema:
        $ref: '#/components/schemas/StatutPublication'
    CommandeId:
      name: id
      in: path
      required: true
      schema:
        type: string
    StaffUserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
          description: Le role MANAGER est unique et ne peut pas etre attribue via cette route.
        mustChangePassword:
          type: boolean
          description: Vrai quand la connexion utilise un mot de passe temporaire et qu'aucun JWT n'est emis.
    FirstLoginPasswordRequest:
      type: object
      required: [username, temporaryPassword, newPassword]
      properties:
        username:
          type: string
        temporaryPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
    StaffUserCreateRequest:
      type: object
      required: [firstName, lastName, address, cni, phone, username, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        address:
          type: string
        cni:
          type: string
          pattern: '^[0-9]{14}$'
        phone:
          type: string
        username:
          type: string
          minLength: 3
        role:
          $ref: '#/components/schemas/Role'
          description: Le role MANAGER est reserve au compte unique du systeme.
    StaffUserUpdateRequest:
      type: object
      required: [username, role, active]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        address:
          type: string
        cni:
          type: string
          pattern: '^[0-9]{14}$'
        phone:
          type: string
        username:
          type: string
          minLength: 3
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
    StaffUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        address:
          type: string
        cni:
          type: string
        phone:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
        mustChangePassword:
          type: boolean
    TemporaryPasswordResponse:
      type: object
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: '#/components/schemas/StaffUser'
        temporaryPassword:
          type: string
    Role:
      type: string
      enum: [CUISINE, GERANT, MANAGER, LIVREUR, VENDEUR]
    StatutPublication:
      type: string
      description: Cycle editorial du back-office (Gerant). Seul ACTIF est visible cote client.
      enum: [BROUILLON, ACTIF, ARCHIVE]
    Categorie:
      type: object
      required: [id, nom, statut]
      properties:
        id:
          type: string
        nom:
          type: string
        statut:
          $ref: '#/components/schemas/StatutPublication'
        updatedAt:
          type: string
          format: date-time
    Produit:
      type: object
      required: [id, nom, prix, categorieId, statut, disponibilite]
      properties:
        id:
          type: string
        nom:
          type: string
        description:
          type: string
        prix:
          type: number
          description: Prix en F CFA
        categorieId:
          type: string
        photoUrl:
          type: string
          nullable: true
        statut:
          $ref: '#/components/schemas/StatutPublication'
        disponibilite:
          type: string
          enum: [EN_STOCK, RUPTURE]
        tendance:
          type: boolean
          description: Mise en avant "Tendance" decidee par le Gerant
        updatedAt:
          type: string
          format: date-time
    JourSemaine:
      type: string
      enum: [LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI, DIMANCHE]
    PlatDuJour:
      type: object
      required: [id, nom, prix, jour, statut]
      properties:
        id:
          type: string
        nom:
          type: string
        description:
          type: string
        prix:
          type: number
        photoUrl:
          type: string
          nullable: true
        jour:
          $ref: '#/components/schemas/JourSemaine'
        statut:
          $ref: '#/components/schemas/StatutPublication'
        updatedAt:
          type: string
          format: date-time
    AccompagnementCondiment:
      type: object
      required: [id, nom, prix, type, statut]
      properties:
        id:
          type: string
        nom:
          type: string
        prix:
          type: number
          description: 0 autorise (offert)
        type:
          type: string
          enum: [ACCOMPAGNEMENT, CONDIMENT]
        statut:
          $ref: '#/components/schemas/StatutPublication'
        updatedAt:
          type: string
          format: date-time
    AnnonceSlide:
      type: object
      required: [id, titre]
      properties:
        id:
          type: string
        titre:
          type: string
        message:
          type: string
        imageUrl:
          type: string
          description: Vide = slide sans image
    Annonce:
      type: object
      description: Chaine d'une ou plusieurs slides
      required: [id, titre, slides, statut]
      properties:
        id:
          type: string
        titre:
          type: string
        slides:
          type: array
          items:
            $ref: '#/components/schemas/AnnonceSlide'
        statut:
          $ref: '#/components/schemas/StatutPublication'
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    Region:
      type: object
      required: [id, nom, active]
      properties:
        id:
          type: string
          description: Code region, ex. DAKAR
        nom:
          type: string
        active:
          type: boolean
    Secteur:
      type: object
      description: Arrondissement officiel ou zone ajoutee par le Gerant
      required: [id, regionId, nom, prixLivraison]
      properties:
        id:
          type: string
        regionId:
          type: string
        departement:
          type: string
        nom:
          type: string
        prixLivraison:
          type: number
        estOfficiel:
          type: boolean
        estMasque:
          type: boolean
    Canal:
      type: string
      description: APP = App Client ; COMPTOIR = saisie par le Vendeur
      enum: [APP, COMPTOIR]
    ModeCommande:
      type: string
      enum: [LIVRAISON, RETRAIT]
    MoyenPaiement:
      type: string
      description: especes uniquement au comptoir (une commande APP est payee en ligne)
      enum: [wave, orange-money, mixx-yas, carte, especes]
    LigneCommande:
      type: object
      required: [produitId, quantite]
      properties:
        produitId:
          type: string
          description: Id d'un Produit, ou d'un PlatDuJour si type = PLAT_DU_JOUR
        type:
          type: string
          enum: [PRODUIT, PLAT_DU_JOUR]

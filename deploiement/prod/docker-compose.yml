# Production SenYummies : HTTPS (Caddy), MySQL sauvegarde chaque nuit,
# backend en profil prod, App Client et Manager.
#
#   cd deploiement/prod
#   cp .env.exemple .env          # domaines, secrets, prestataire de paiement
#   docker compose up -d --build
#
# Prerequis : un serveur avec Docker, les deux domaines pointant (DNS A/AAAA)
# vers lui, ports 80 et 443 ouverts. Caddy obtient et renouvelle seul les
# certificats Let's Encrypt. Seul Caddy est expose a Internet : backend et
# MySQL restent sur le reseau interne.
#
# Le backend REFUSE de demarrer en prod si un reglage est dangereux (secret
# JWT faible, comptes de demo, paiement simule...) : lire ses journaux
# (docker compose logs backend) au premier lancement.
name: senyummies

services:
  caddy:
    image: caddy:2.10-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE_CLIENT: ${DOMAINE_CLIENT:?Renseignez DOMAINE_CLIENT}
      DOMAINE_MANAGER: ${DOMAINE_MANAGER:?Renseignez DOMAINE_MANAGER}
      EMAIL_CERTIFICATS: ${EMAIL_CERTIFICATS:?Renseignez EMAIL_CERTIFICATS (avis Let's Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-donnees:/data
      - caddy-config:/config
    depends_on:
      client:
        condition: service_healthy
      manager:
        condition: service_healthy
    logging: &journaux
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Renseignez MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: senyummies
      MYSQL_USER: senyummies
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Renseignez MYSQL_PASSWORD}
      TZ: Africa/Dakar
    volumes:
      - mysql-donnees:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *journaux

  sauvegarde:
    # Sauvegarde logique chaque nuit (vers 02:00, heure de Dakar), conservee
    # SAUVEGARDE_JOURS jours dans le volume "sauvegardes". A copier aussi HORS
    # du serveur (voir README) : une sauvegarde sur le meme disque ne protege
    # pas d'une panne du serveur.
    image: mysql:8.0
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD}
      SAUVEGARDE_JOURS: ${SAUVEGARDE_JOURS:-14}
      TZ: Africa/Dakar
    volumes:
      - sauvegardes:/sauvegardes
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        while true; do
          attente=$$(( ( $$(date -d 'tomorrow 02:00' +%s) - $$(date +%s) ) ))
          sleep "$$attente"
          fichier=/sauvegardes/senyummies-$$(date +%Y%m%d-%H%M).sql.gz
          if mysqldump -h mysql -u senyummies --single-transaction --routines --no-tablespaces senyummies | gzip > "$$fichier.tmp"; then
            mv "$$fichier.tmp" "$$fichier" && echo "sauvegarde OK : $$fichier"
          else
            rm -f "$$fichier.tmp"; echo "ECHEC de la sauvegarde" >&2
          fi
          find /sauvegardes -name 'senyummies-*.sql.gz' -mtime +"$$SAUVEGARDE_JOURS" -delete
        done
    logging: *journaux

  backend:
    build: ../..
    image: senyummies/backend:${VERSION:-latest}
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/senyummies
      SPRING_DATASOURCE_USERNAME: senyummies
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET:?Renseignez JWT_SECRET (32 caracteres minimum, aleatoire)}
      APP_AUTH_SEED_ENABLED: "false"
      # Premier lancement seulement : premier compte Manager, puis vider ces deux lignes du .env.
      APP_AUTH_MANAGER_INITIAL_IDENTIFIANT: ${MANAGER_INITIAL_IDENTIFIANT:-}
      APP_AUTH_MANAGER_INITIAL_MOT_DE_PASSE: ${MANAGER_INITIAL_MOT_DE_PASSE:-}
      # Meme domaine que les fronts (relais nginx) : CORS inutile, mais jamais "*".
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAINE_CLIENT},https://${DOMAINE_MANAGER}
      # Prestataire de paiement : voir docs/reste-a-faire.md (1.1). "simule" est refuse en prod.
      APP_PAIEMENT_PRESTATAIRE: ${PAIEMENT_PRESTATAIRE:?Renseignez PAIEMENT_PRESTATAIRE (prestataire reel)}
      TZ: Africa/Dakar
    volumes:
      - photos:/app/donnees/photos
    logging: *journaux

  client:
    build: ../../../Client_RestoApp
    image: senyummies/client:${VERSION:-latest}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: /api/v1
      API_UPSTREAM: http://backend:8080
      SUPPORT_TELEPHONE: ${SUPPORT_TELEPHONE:?Renseignez SUPPORT_TELEPHONE}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Renseignez SUPPORT_EMAIL}
    logging: *journaux

  manager:
    build: ../../../Manager_RestoApp
    image: senyummies/manager:${VERSION:-latest}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: /api/v1
      API_UPSTREAM: http://backend:8080
      SUPPORT_TELEPHONE: ${SUPPORT_TELEPHONE}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
    logging: *journaux

volumes:
  caddy-donnees:
  caddy-config:
  mysql-donnees:
  sauvegardes:
  photos:

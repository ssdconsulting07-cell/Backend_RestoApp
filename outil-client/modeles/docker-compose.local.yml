# Essai EN LOCAL de la version du restaurant, avant la mise en ligne
# (genere par npm run client). Pas de HTTPS ni de domaine : les deux apps
# sont servies sur le poste, le paiement est SIMULE.
#
#   docker compose --env-file .env --env-file .env.secrets \
#     -f docker-compose.yml -f docker-compose.local.yml up -d
#
#   App Client : http://localhost:8081      Manager : http://localhost:8082

services:
  caddy:
    # Pas de Caddy en local.
    profiles: ["production"]

  backend:
    environment:
      # Profil par defaut (sans "prod") : paiement simule autorise.
      SPRING_PROFILES_ACTIVE: local
      APP_PAIEMENT_PRESTATAIRE: simule
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:8082

  client:
    ports:
      - "8081:8080"

  manager:
    ports:
      - "8082:8080"

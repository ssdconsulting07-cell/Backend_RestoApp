# Profil des TESTS DE CHARGE (load-tests/, deploiement/loadtest).
# JAMAIS en production : le backend refuse de demarrer avec prod + loadtest.

# Catalogue de demonstration (27 produits, Dakar ouverte), comme le profil dev.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Limites de debit relevees pour TOUTES les IP : tous les utilisateurs
# virtuels k6 partent de la meme machine (une seule IP). Le comportement
# normal (10 commandes / 10 connexions par minute) se verifie a part avec
# load-tests/limitation-debit.js sur un backend en profil dev.
app.limitation.commandes-par-minute=1000000
app.limitation.suivi-par-minute=1000000
app.limitation.connexions-par-minute=1000000

# Metriques Prometheus sur un port de gestion SEPARE (9090), jamais relaye
# par nginx : http://localhost:9090/actuator/prometheus
# CPU, memoire JVM, pool Hikari (hikaricp_*), cache (cache_*), requetes
# HTTP (http_server_requests_*) et SQL (statistiques Hibernate, hibernate_*).
management.server.port=9090
management.endpoints.access.default=read-only
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
spring.jpa.properties.hibernate.generate_statistics=true
# Les caches du catalogue publient leurs compteurs (hits / misses).
# Liste complete (une liste fixe desactive la creation de caches a la volee).
spring.cache.cache-names=categories,produits,platsDuJour,accompagnements,annonces,regions,secteurs

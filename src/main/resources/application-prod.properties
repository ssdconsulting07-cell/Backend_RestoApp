# Profil de production (SPRING_PROFILES_ACTIVE=prod).
# Toutes les valeurs sensibles viennent des variables d'environnement
# (voir .env.example) ; ce fichier ne fait que durcir les reglages.

# Documentation API non exposee en production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Comptes de demonstration interdits en production (voir aussi
# VerificationConfigurationProd, qui refuse de demarrer sinon).
app.auth.seed.enabled=false

# Schema seulement : jamais les donnees de demonstration (db/demo).
spring.flyway.locations=classpath:db/migration

# Pas de detail technique dans les reponses d'erreur.
server.error.include-message=never
server.error.include-stacktrace=never

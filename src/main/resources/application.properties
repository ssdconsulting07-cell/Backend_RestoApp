spring.application.name=senyummies-backend

# Toutes les routes sont servies sous /api/v1 (voir backend/contrat-api/openapi.yaml)
server.servlet.context-path=/api/v1
server.port=8080

# --- Base de donnees MySQL : a completer (ou fournie par docker-compose, voir .env.example) ---
spring.datasource.url=jdbc:mysql://localhost:3306/chez_ketchup
spring.datasource.username=CHANGE_ME
spring.datasource.password=CHANGE_ME

# Le schema est gere par Flyway (src/main/resources/db/migration) ; Hibernate
# se contente de verifier que les entites correspondent aux tables.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
# Une migration par lot, jamais modifiee une fois fusionnee. Les bases deja
# creees par Hibernate (avant Flyway) sont "baselinees" en version 1 : V1 n'y
# est pas rejouee, les migrations suivantes (V1_1...) s'appliquent.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema cree par Hibernate avant Flyway
# Jamais de requetes SQL dans les logs : elles contiendraient des donnees
# personnelles (nom, telephone, position GPS des clients).
spring.jpa.show-sql=false

# --- Derriere le relais nginx des fronts (/api/ -> backend) ---
# Prend en compte X-Forwarded-For / X-Forwarded-Proto pour la vraie IP du
# client (limitation de debit, audit) et la detection HTTPS. "native" =
# RemoteIpValve de Tomcat, qui ne fait confiance qu'aux proxys des reseaux
# prives (10/8, 172.16/12, 192.168/16, 127/8) : un client exterieur ne peut
# pas usurper son IP en envoyant lui-meme X-Forwarded-For.
server.forward-headers-strategy=native

# CORS : origines autorisees (app-client + app-manager en dev)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5174

# --- JWT (authentification du staff SenYummies Manager uniquement) ---
# Valeur par defaut utilisable en local. En production, toujours la fournir via
# la variable d'environnement APP_JWT_SECRET (voir docker-compose.yml / .env.example),
# jamais commitee en clair.
app.jwt.secret=changez-moi-avec-une-chaine-longue-et-aleatoire-en-production
app.jwt.expiration-ms=86400000

# --- Comptes staff de developpement ---
# Activer uniquement en local avec APP_AUTH_SEED_ENABLED=true et fournir les
# quatre mots de passe via les variables APP_AUTH_SEED_*_PASSWORD.
app.auth.seed.enabled=${APP_AUTH_SEED_ENABLED:false}
app.auth.seed.cuisine.password=${APP_AUTH_SEED_CUISINE_PASSWORD:}
app.auth.seed.gerant.password=${APP_AUTH_SEED_GERANT_PASSWORD:}
app.auth.seed.manager.password=${APP_AUTH_SEED_MANAGER_PASSWORD:}
app.auth.seed.livreur.password=${APP_AUTH_SEED_LIVREUR_PASSWORD:}
app.auth.seed.vendeur.password=${APP_AUTH_SEED_VENDEUR_PASSWORD:}

# Documentation API generee (springdoc) : servie sous /api/v1/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
